name: Release

# Push a tag to build and publish ONE artifact:
#   ARI_Desktop_v<ver>            -> builds the desktop app, published as a pre-release
#   ARI_Desktop_Installer_v<ver>  -> builds the installer,   published as Latest
# Pushing an app tag never rebuilds the installer, and vice versa.
#
# Before tagging, edit the matching notes file under .github/release-notes/ — its contents become
# the release changelog verbatim (no # headings; the release title is the heading).

on:
  push:
    tags:
      - "ARI_Desktop_v*"
      - "ARI_Desktop_Installer_v*"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.meta.outputs.target }}
      version: ${{ steps.meta.outputs.version }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      latest: ${{ steps.meta.outputs.latest }}
      notes: ${{ steps.meta.outputs.notes }}
      pattern: ${{ steps.meta.outputs.pattern }}
      vfile: ${{ steps.meta.outputs.vfile }}
    steps:
      - id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == ARI_Desktop_Installer_v* ]]; then
            V="${TAG#ARI_Desktop_Installer_v}"
            {
              echo "target=installer"; echo "version=$V"
              echo "title=A·R·I Desktop Installer v$V"
              echo "prerelease=false"; echo "latest=true"
              echo "notes=.github/release-notes/installer.md"
              echo "pattern=ARI_Desktop_Installer_v*"
              echo "vfile=ARI.Desktop.Installer/package.json"
            } >> "$GITHUB_OUTPUT"
          else
            V="${TAG#ARI_Desktop_v}"
            {
              echo "target=app"; echo "version=$V"
              echo "title=A·R·I Desktop v$V"
              echo "prerelease=true"; echo "latest=false"
              echo "notes=.github/release-notes/app.md"
              echo "pattern=ARI_Desktop_v*"
              echo "vfile=ARI.Desktop/package.json"
            } >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: mac,   os: macos-latest,  plats: mac }        # dmg + native codesign
          - { id: other, os: ubuntu-latest, plats: win linux }  # AppImage native, win via wine
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync tag version into the build file
        run: |
          f="${{ needs.setup.outputs.vfile }}"
          tmp="$(mktemp)"
          jq --arg v "${{ needs.setup.outputs.version }}" '.version = $v' "$f" > "$tmp" && mv "$tmp" "$f"

      - uses: oven-sh/setup-bun@v2

      # electron-builder runs rcedit via wine to stamp any Windows .exe (the app itself and the
      # portable installer), so wine is needed for every Windows build on the Linux runner.
      - name: Install wine (Linux — needed to stamp Windows .exe)
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32 wine64 || sudo apt-get install -y --no-install-recommends wine

      - name: Install dependencies
        run: |
          if [[ "${{ needs.setup.outputs.target }}" == "app" ]]; then
            (cd ARI.Desktop && bun install)
          else
            (cd ARI.Desktop.Installer && bun install)
          fi

      - name: Build
        env:
          BUILD_TARGET: ${{ needs.setup.outputs.target }}
          BUILD_PLATFORM: ${{ matrix.plats }}
        run: cd ARI.Desktop && bun build-all.js

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.id }}
          path: Builds/**/${{ needs.setup.outputs.pattern }}
          if-no-files-found: error

  publish:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t FILES < <(find dist -type f -name '${{ needs.setup.outputs.pattern }}')
          echo "Uploading: ${FILES[*]}"
          ARGS=()
          [[ "${{ needs.setup.outputs.prerelease }}" == "true" ]] && ARGS+=(--prerelease)
          [[ "${{ needs.setup.outputs.latest }}" == "true" ]] && ARGS+=(--latest)
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ needs.setup.outputs.title }}" \
            --notes-file "${{ needs.setup.outputs.notes }}" \
            "${ARGS[@]}" \
            "${FILES[@]}"
