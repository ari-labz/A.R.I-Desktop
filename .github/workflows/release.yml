name: Release

# Push a tag ARI_Desktop_v<ver> to build the desktop app and publish it (a pre-release while the version is 0.x).
# (The installer lives in its own repo: https://github.com/ari-labz/Installer)
#
# Before tagging, edit .github/release-notes/app.md — its contents become
# the release changelog verbatim (no # headings; the release title is the heading).

on:
  push:
    tags:
      - "ARI_Desktop_v*"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.meta.outputs.target }}
      version: ${{ steps.meta.outputs.version }}
      title: ${{ steps.meta.outputs.title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      latest: ${{ steps.meta.outputs.latest }}
      notes: ${{ steps.meta.outputs.notes }}
      pattern: ${{ steps.meta.outputs.pattern }}
      vfile: ${{ steps.meta.outputs.vfile }}
    steps:
      - id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          V="${TAG#ARI_Desktop_v}"
          # 0.x versions are pre-releases; v1 and later are normal releases and become Latest.
          if [[ "$V" == 0.* ]]; then P=true; LATEST=false; else P=false; LATEST=true; fi
          {
            echo "target=app"; echo "version=$V"
            echo "title=A·R·I Desktop v$V"
            echo "prerelease=$P"; echo "latest=$LATEST"
            echo "notes=.github/release-notes/app.md"
            echo "pattern=ARI_Desktop_v*"
            echo "vfile=ARI.Desktop/package.json"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: mac,   os: macos-latest,  plats: mac }        # dmg + native codesign
          - { id: other, os: ubuntu-latest, plats: win linux }  # AppImage native, win via wine
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync tag version into the build file
        run: |
          f="${{ needs.setup.outputs.vfile }}"
          tmp="$(mktemp)"
          jq --arg v "${{ needs.setup.outputs.version }}" '.version = $v' "$f" > "$tmp" && mv "$tmp" "$f"

      - uses: oven-sh/setup-bun@v2

      # electron-builder runs rcedit via wine to stamp any Windows .exe (the app itself), so wine is needed for every Windows build on the Linux runner.
      - name: Install wine (Linux — needed to stamp Windows .exe)
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32 wine64 || sudo apt-get install -y --no-install-recommends wine

      - name: Install dependencies
        run: |
          (cd ARI.Desktop && bun install)

      - name: Build
        env:
          BUILD_PLATFORM: ${{ matrix.plats }}
        run: cd ARI.Desktop && bun build-all.js

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.id }}
          path: Builds/**/${{ needs.setup.outputs.pattern }}
          if-no-files-found: error

  publish:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t FILES < <(find dist -type f -name '${{ needs.setup.outputs.pattern }}')
          echo "Uploading: ${FILES[*]}"
          ARGS=()
          [[ "${{ needs.setup.outputs.prerelease }}" == "true" ]] && ARGS+=(--prerelease)
          [[ "${{ needs.setup.outputs.latest }}" == "true" ]] && ARGS+=(--latest)
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ needs.setup.outputs.title }}" \
            --notes-file "${{ needs.setup.outputs.notes }}" \
            "${ARGS[@]}" \
            "${FILES[@]}"
